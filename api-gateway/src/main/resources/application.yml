server:
  port: 8081

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - AuthenticationFilter
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/usage/**
          filters:
            - PreserveHostHeader
        - id: navigation-service
          uri: lb://navigation-service
          predicates:
            - Path=/api/v1/navigation/**, /ws-navigation/**
          filters:
            - PreserveHostHeader
        - id: place-service
          uri: lb://place-service
          predicates:
            - Path=/api/v1/places/**, /api/v1/visit-histories/**, /api/v1/preferences/**
          filters:
            - PreserveHostHeader
            - name: AuthenticationFilter
              args:
                enabled: false 
        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/api/v1/schedules/**, /api/v1/routes/**
          filters:
              - PreserveHostHeader

app:
  jwt:
    secret: ${APP_JWT_SECRET}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS

logging:
  level:
    com.example.api_gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    reactor.netty.http.client: DEBUG


    